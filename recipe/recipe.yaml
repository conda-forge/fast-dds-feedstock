schema_version: 1

context:
  name: fast-dds
  version: "3.6.2.0"
  major_minor_version: ${{ (version | split('.'))[:2] | join('.') }}

package:
  name: fast-dds
  version: ${{ version }}

source:
  - url: https://github.com/eProsima/Fast-DDS/archive/v${{ version }}.tar.gz
    sha256: 6d2c3687f3d5897974027cf264deac251eefc48fbfd7f9344f4d8d9660bb68e7
    patches:
      - patches/0001-support-macos-11.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake <4
    - ninja
    - pkg-config
  host:
    - fast-cdr >=2.3.6,<3
    - asio >=1.34.2
    - tinyxml2
    - openssl
    - foonathan-memory
  run:
    - python
    - psutil
    - xmlschema
    - if: win
      then: pywin32
    - fast-cdr >=2.3.6,<3
    - asio >=1.34.2
    - tinyxml2
    - openssl
    - foonathan-memory
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x') }}
  run_constraints:
    - python >=3.6
    - fast-rtps ==99999999 fast_rtps_collides_with_fast_dds

tests:
  - package_contents:
      bin:
        - fast-discovery-server
      lib:
        - if: win
          then: fastdds-${{ major_minor_version }}
          else: fastdds
      include:
        - fastdds/dds/domain/DomainParticipantFactory.hpp
        - fastdds/rtps/Endpoint.hpp
        - fastdds/rtps/transport/UDPTransportDescriptor.hpp

  - script:
      - if: win
        then:
          - call fastdds --help
          - call fastdds discovery --help
          - call fastdds xml validate --help
          - call ros-discovery --help
        else:
          - fastdds --help
          - fastdds discovery --help
          - fastdds xml validate --help
          - ros-discovery --help

  - requirements:
      run:
        - ${{ compiler('cxx') }}
        - cmake <4
        - ninja
    files:
      recipe:
        - cmake_test/
    script:
      - if: unix
        then: cmake -S cmake_test -B consumer -G Ninja $CMAKE_ARGS
        else: cmake -S cmake_test -B consumer -G Ninja %CMAKE_ARGS%
      - cmake --build consumer
      - ctest --test-dir consumer --output-on-failure

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: |
    eProsima Fast DDS (formerly Fast-RTPS)


  homepage: https://github.com/eProsima/Fast-RTPS

extra:
  recipe-maintainers:
    - wolfv
    - MiguelCompany
    - rsanchez15
